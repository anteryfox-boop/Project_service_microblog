services:
  postgres_db:
    image: postgres:15
    container_name: test_fastapi_db
    environment:
      POSTGRES_USER: olga
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: microblog
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  fastapi_app:
    build: .
    container_name: test_fastapi_app
    restart: always
    ports:
      - "8000:8000"
    depends_on:
      - postgres_db
    env_file:
      - .env
    volumes:
      - ./media:/app/media

  nginx:
    image: nginx:1.25-alpine
    container_name: test_nginx
    ports:
      - "8001:80"
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ./media:/app/media:ro
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - fastapi_app

volumes:
  postgres_data:



