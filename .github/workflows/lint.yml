name: Linters & Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt
        pip install black==24.10.0 isort==5.13.2 flake8==7.1.1
    # 1. Проверка форматирования (через python -m)
    - name: Check formatting with black
      run: python -m black --check app/ tests/

    # 2. Проверка импортов (через python -m)
    - name: Check import sorting with isort
      run: python -m isort --check-only app/ tests/

    # 3. Проверка стиля (через python -m)
    - name: Run flake8
      run: python -m flake8 app/ tests/

    # 4. Проверка типов (через python -m)
    - name: Run mypy
      run: python -m mypy app/ tests/

    # 5. Запуск тестов (через python -m)
    - name: Run tests
      run: python -m pytest tests/ -v
